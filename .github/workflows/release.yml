name: Release installable ZIP

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.2.0)'
        required: true
        type: string
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ['1.24.7', '1.25.x']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Build and test with the container toolchain
        env:
          GO111MODULE: 'off'
          CGO_ENABLED: '0'
        run: |
          go version
          go test ./backend/container
          go vet ./backend/container
          go build -trimpath -ldflags '-s -w -X main.version=ci' -o "$RUNNER_TEMP/scratch-tab" ./backend/container
  host-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: scratch-tab
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: futrx-com/remote.futrx
          path: remote-core
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: remote-core/backend/go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build frontend for package validation
        working-directory: scratch-tab
        run: |
          npm ci
          npm run build
      - name: Validate generated host backend, tests and vet
        run: python3 -B scratch-tab/backend/tests/test_host_backend.py --remote-root "$GITHUB_WORKSPACE/remote-core"
  release:
    needs: [container-compatibility, host-backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install and build TypeScript frontend
        run: |
          npm ci
          npm run format:check
          npm run typecheck
          npm run build
      - name: Test file command and package
        run: |
          GO111MODULE=off go test ./backend/container
          GO111MODULE=off go vet ./backend/container
          npm run test:infra
      - name: Test editor in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:frontend
      - name: Build installable ZIP
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 -B infra/package.py --tag "$RELEASE_TAG" --output-dir "$RUNNER_TEMP/package"
      - name: Publish release with ZIP attachment
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/package/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/package/*.zip \
              --verify-tag --title "Scratch Tab $RELEASE_TAG" --generate-notes
          fi

name: Release installable ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test file command and package
        run: |
          GO111MODULE=off go test ./backend/container
          GO111MODULE=off go vet ./backend/container
          python3 -B infra/test_package.py
      - name: Test editor in Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node --test infra/test.mjs
      - name: Build installable ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B infra/package.py --tag "$RELEASE_TAG" --output-dir "$RUNNER_TEMP/package"
      - name: Publish release with ZIP attachment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/package/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/package/*.zip \
              --verify-tag --title "Scratch Tab $RELEASE_TAG" --generate-notes
          fi
